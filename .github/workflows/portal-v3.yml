name: One-time - install Doctor Portal v3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/portal-v3.yml', '.github/workflows/medident-portal-v3.tar.gz', 'medident-portal-v3.tar.gz']
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Doctor Portal v3, check it, commit it, remove this helper
        run: |
          set -euo pipefail
          BUNDLE=""
          for f in medident-portal-v3.tar.gz .github/workflows/medident-portal-v3.tar.gz; do
            if [ -f "$f" ]; then BUNDLE="$f"; fi
          done
          if [ -z "$BUNDLE" ]; then echo "Bundle not uploaded yet - nothing to do."; exit 0; fi
          echo "d109e36263daaf6b3fb781fc4c53682f809dbc915e44228f7d47ef7adc41b38d  $BUNDLE" | sha256sum -c -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tar -xzf "$BUNDLE"
          git rm -q "$BUNDLE" .github/workflows/portal-v3.yml
          git add -A
          # Must equal main (7e1d41d) + exactly the 23 portal v3 files, nothing else.
          test "$(git write-tree)" = "ccf0c57a02f51790dae569c79f49d9fd324918eb"
          git commit -q -F - <<'MSG'
          Medident Academy Doctor Portal v3: CPD hours, Add to LinkedIn, course feedback, continue where you left off, Excel export, upload size guard, bilingual account emails

          Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01ANRw5N9tXvqWjsBQGWBUht
          MSG
          git push origin HEAD:main
