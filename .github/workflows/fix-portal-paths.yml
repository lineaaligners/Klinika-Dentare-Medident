name: One-time fix - put Doctor Portal files in their folders
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-portal-paths.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move files, restore types.ts, remove this workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p components/portal/admin services supabase api
          git rm -q components/AcademyPage.tsx
          git mv AcademyPage.tsx components/AcademyPage.tsx
          git mv types.ts components/portal/types.ts
          git checkout 023117ba51b4ed7732d31b8d83a5caf560cefdd9 -- types.ts
          git mv AccountScreen.tsx CourseScreen.tsx DashboardScreen.tsx DoctorPortal.tsx LessonViewer.tsx LoginScreen.tsx PortalHeader.tsx components/portal/
          git mv AdminScreen.tsx AssignmentsAdmin.tsx CoursesAdmin.tsx DoctorsAdmin.tsx LessonsAdmin.tsx components/portal/admin/
          git mv portalApi.ts supabaseClient.ts services/
          git mv schema.sql supabase/
          git mv portal-admin.ts api/
          echo "" | base64 -d > .env.example
          git add .env.example
          git rm -q .github/workflows/fix-portal-paths.yml
          test "$(git write-tree)" = "78b96266042760583aad8ebd3f83165f53ebc758"
          git commit -q -m "Move Doctor Portal files into their folders and restore types.ts"
          git push origin HEAD:main
